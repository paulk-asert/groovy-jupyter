# Builds the portable kernelspec zip. A pushed vX.Y.Z tag creates a *draft*
# GitHub release with the zip + checksum attached (published by hand after
# review); a manual run is a dry run that only uploads the zip as a workflow
# artifact. See docs/releasing.md.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            ./gradlew --no-daemon test kernelSpecZip -PreleaseVersion="${GITHUB_REF_NAME#v}"
          else
            ./gradlew --no-daemon test kernelSpecZip
          fi
          cd build/distributions && sha256sum *.zip > SHA256SUMS

      - uses: actions/upload-artifact@v7
        with:
          name: kernelspec
          path: build/distributions/

      - name: Create draft release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/distributions/* \
            --draft --generate-notes --title "groovy-jupyter ${GITHUB_REF_NAME#v}"
