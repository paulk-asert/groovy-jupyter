plugins {
    id 'java'
}

group = 'groovyx.jupyter'
version = '0.1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

def groovyVersion = '6.0.0-beta-3'

dependencies {
    implementation('org.dflib.jjava:jjava-jupyter:1.0-a8') {
        // released JeroMQ (0.6.0) fakes ipc:// over loopback TCP; the vendored build below has real Unix sockets
        exclude group: 'org.zeromq', module: 'jeromq'
    }
    // JeroMQ built from master (zeromq/jeromq#998: Unix-domain-socket ipc on JDK 16+) — see libs/README.md.
    // Needed for hosts that launch kernels with --transport=ipc (Google Colab); drop once 0.7.0 is on Central.
    implementation files('libs/jeromq-0.7.0-SNAPSHOT.jar')
    runtimeOnly 'eu.neilalexander:jnacl:1.0.0' // JeroMQ's own runtime dependency (CURVE), lost with the exclude above
    implementation "org.apache.groovy:groovy:${groovyVersion}"
    // maven-resolver-based GrapeEngine (no Ivy); discovered via ServiceLoader at runtime
    runtimeOnly "org.apache.groovy:groovy-grape-maven:${groovyVersion}"
    // ASF Groovy optional modules shipped with the kernel (not third-party bundling);
    // which further modules (json, sql, ...) ship by default is pending team review
    runtimeOnly "org.apache.groovy:groovy-csv:${groovyVersion}"
    runtimeOnly "org.apache.groovy:groovy-ginq:${groovyVersion}"
    // slf4j-simple, NOT slf4j-jdk14: grabbed libraries that install the JUL->SLF4J
    // bridge (Spark does) would loop infinitely with a JUL-bound slf4j (StackOverflowError)
    runtimeOnly 'org.slf4j:slf4j-simple:2.0.17'

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// compile for the JDK 17 baseline on whatever JDK runs the build
// (portable across environments like Binder where no JDK 17 toolchain exists)
tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

test {
    useJUnitPlatform()
}

def kernelInstallDir = {
    def os = System.getProperty('os.name').toLowerCase()
    def home = System.getProperty('user.home')
    def base = os.contains('mac') ? "${home}/Library/Jupyter"
            : os.contains('win') ? "${home}/AppData/Roaming/jupyter"
            : "${home}/.local/share/jupyter"
    file("${base}/kernels/groovy")
}

// portable kernelspec: relies on Jupyter's {resource_dir} argv substitution and
// a `java` (17+) on the PATH, so the zip installs anywhere with
// `jupyter kernelspec install <unzipped-dir> --user --name groovy`
def portableSpecDir = layout.buildDirectory.dir('portable-kernelspec')

tasks.register('portableKernelJson') {
    outputs.dir(portableSpecDir)
    doLast {
        def spec = [
                argv          : ['java', '-cp', '{resource_dir}/lib/*', 'groovyx.jupyter.GroovyKernelLauncher', '{connection_file}'],
                display_name  : "Groovy ${groovyVersion}".toString(),
                language      : 'groovy',
                interrupt_mode: 'message',
                env           : [:]
        ]
        def dir = portableSpecDir.get().asFile
        dir.mkdirs()
        new File(dir, 'kernel.json').text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(spec))
    }
}

tasks.register('kernelSpecZip', Zip) {
    description = 'Builds a portable kernelspec zip (kernel.json + lib/) installable via jupyter kernelspec install'
    group = 'distribution'
    archiveBaseName = 'groovy-jupyter-kernelspec'
    from(tasks.named('portableKernelJson'))
    from(tasks.jar) { into 'lib' }
    from(configurations.runtimeClasspath) { into 'lib' }
}

tasks.register('installKernelSpec', Sync) {
    description = 'Installs the Groovy kernelspec (jars + kernel.json) into the per-user Jupyter kernels directory'
    group = 'distribution'
    // kernel.json is written in doLast, so a JVM/args change must defeat up-to-date checking
    inputs.property('javaHome', project.findProperty('javaHome') ?: System.getProperty('java.home'))
    inputs.property('jvmArgs', project.findProperty('jvmArgs') ?: '')
    from(tasks.jar) { into 'lib' }
    from(configurations.runtimeClasspath) { into 'lib' }
    into kernelInstallDir()
    doLast {
        def dir = kernelInstallDir()
        // override with -PjavaHome=/path/to/jdk to pin a different JVM into the kernelspec
        def javaExe = "${project.findProperty('javaHome') ?: System.getProperty('java.home')}/bin/java"
        // extra JVM flags via -PjvmArgs='--add-opens=... -Dfoo=bar' (space-separated) —
        // needed e.g. for Arrow/Spark Connect (java.nio opens) or the Vector API
        def extraArgs = ((project.findProperty('jvmArgs') ?: '') as String).tokenize(' ')
        def spec = [
                argv          : ([javaExe] + extraArgs + ['-cp', "${dir}/lib/*".toString(), 'groovyx.jupyter.GroovyKernelLauncher', '{connection_file}']),
                display_name  : "Groovy ${groovyVersion}".toString(),
                language      : 'groovy',
                interrupt_mode: 'message',
                env           : [:]
        ]
        new File(dir, 'kernel.json').text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(spec))
        println "Installed Groovy kernelspec into ${dir}"
    }
}
